# Builds Parla for Windows and Linux on GitHub's machines, since they can't be built on
# a Mac. The installers are attached to each run as artifacts for testing.
name: Windows and Linux builds

on:
  workflow_dispatch:
  push:
    branches: [windows-linux]

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    env:
      # llama.cpp has to use the static C runtime on Windows, like the prebuilt speech
      # library it is linked with. Ignored elsewhere.
      LLAMA_STATIC_CRT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libasound2-dev libclang-dev cmake libxdo-dev

      - name: Static C runtime for llama.cpp
        if: matrix.name == 'windows'
        shell: bash
        run: echo "CMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/src-tauri/cmake/msvc-static-crt.cmake" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Bumped when a native library's build settings change, since Cargo doesn't
          # rebuild it for an environment change on its own.
          prefix-key: v3

      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --features desktop-engine --lib

      - name: Build installers
        run: pnpm tauri build --features desktop-engine

      - uses: actions/upload-artifact@v4
        with:
          name: parla-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
