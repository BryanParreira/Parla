[package]
name = "parla"
version = "1.5.3"
description = "Fast, fully local dictation for macOS"
authors = ["Bryan Bernardo Parreira"]
license-file = "../LICENSE.md"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519).
name = "parla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
swift-rs = { version = "1.0.7", features = ["build"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swift-rs = "1.0.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Xcode 27's linker strips proc-macro dylibs so rustc can no longer load them
# ("can't find crate for `tauri_macros`"). Only the app itself needs stripping.
[profile.release.build-override]
strip = false
