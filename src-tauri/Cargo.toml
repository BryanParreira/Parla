[package]
name = "parla"
version = "1.5.3"
description = "Fast, fully local dictation"
authors = ["Bryan Bernardo Parreira"]
license-file = "../LICENSE.md"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519).
name = "parla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The Rust engine Windows and Linux run on: Parakeet through sherpa-onnx for speech and a
# small local model through llama.cpp for Enhance. On macOS it replaces the Swift engine,
# which is how the Windows and Linux engine gets tested without a PC.
desktop-engine = ["dep:sherpa-rs", "dep:llama-cpp-2", "dep:cpal", "dep:enigo", "dep:ureq", "dep:whatlang"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0.7", features = ["build"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
llama-cpp-2 = { version = "0.1.158", default-features = false, optional = true }
cpal = { version = "0.18", optional = true }
enigo = { version = "0.6", optional = true }
ureq = { version = "3", features = ["json"], optional = true }
whatlang = { version = "0.16", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
swift-rs = "1.0.7"

# The speech library comes prebuilt for macOS and Windows. Its prebuilt Linux "static"
# package ships only command-line tools, so on Linux it is compiled from source.
[target.'cfg(not(target_os = "linux"))'.dependencies]
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries", "static"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
sherpa-rs = { version = "0.6.8", default-features = false, features = ["static"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Xcode 27's linker strips proc-macro dylibs so rustc can no longer load them
# ("can't find crate for `tauri_macros`"). Only the app itself needs stripping.
[profile.release.build-override]
strip = false
