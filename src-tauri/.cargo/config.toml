# The speech library (sherpa-onnx with ONNX Runtime) and llama.cpp are linked
# statically, so Parla ships as one executable with no extra libraries to install.

# sherpa-onnx's Windows build uses the static C runtime, so Rust and llama.cpp have to
# match it, and it calls into advapi32 (event tracing, registry). sherpa-rs links
# itself as a DLL too, so the library is passed to every link rather than only Parla's.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=advapi32.lib"]

[env]
# Only read by MSVC builds of llama.cpp.
LLAMA_STATIC_CRT = "1"
